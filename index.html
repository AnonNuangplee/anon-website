{id:"brd-fsd",cat:"Business Analysis",tags:["BRD","FSD","SRS"],created:"2026-11-12",updated:"2026-11-12",
 title:{en:"BRD vs FSD: what is the difference?",th:"BRD กับ FSD ต่างกันอย่างไร"},
 sum:{en:"Two documents, two questions: why the business needs it, and what the system will do.",th:"เอกสารสองฉบับ สองคำถาม: ธุรกิจต้องการอะไร และระบบจะทำอะไร"},
 body:{en:"A BRD (Business Requirements Document) describes business goals, scope, stakeholders and the outcomes expected. It answers “what does the business need, and why?”\n\nAn FSD (Functional Specification Document) translates those needs into system behavior: features, inputs, outputs, rules and user roles. It answers “what will the system do?”\n\nGood traceability links each FSD item back to a BRD requirement, so developers, QA and stakeholders share the same understanding.",th:"BRD (Business Requirements Document) อธิบายเป้าหมายทางธุรกิจ ขอบเขต ผู้มีส่วนได้ส่วนเสีย และผลลัพธ์ที่คาดหวัง ตอบคำถามว่า “ธุรกิจต้องการอะไรและเพราะอะไร”\n\nFSD (Functional Specification Document) แปลงความต้องการเหล่านั้นเป็นพฤติกรรมของระบบ เช่น ฟีเจอร์ อินพุต เอาต์พุต กฎ และบทบาทผู้ใช้ ตอบคำถามว่า “ระบบจะทำอะไร”\n\nการเชื่อมโยงรายการใน FSD กลับไปยังความต้องการใน BRD ช่วยให้นักพัฒนา QA และผู้เกี่ยวข้องเข้าใจตรงกัน"},
 refs:[],related:["story-ac"]},
{id:"story-ac",cat:"Business Analysis",tags:["User Story","Acceptance Criteria"],created:"2026-11-12",updated:"2026-11-12",
 title:{en:"Writing user stories with acceptance criteria",th:"การเขียน User Story พร้อม Acceptance Criteria"},
 sum:{en:"A short format that keeps requirements tied to a user and a testable outcome.",th:"รูปแบบสั้น ๆ ที่ผูกความต้องการกับผู้ใช้และผลลัพธ์ที่ทดสอบได้"},
 body:{en:"User story: “As a [role], I want [capability] so that [benefit].”\n\nAcceptance criteria state when the story is done, often as Given / When / Then:\nGiven a visitor has not chosen cookie preferences, when the page loads, then a cookie banner is shown.\n\nCriteria should be specific and testable; they also become the starting point for UAT scenarios.",th:"User Story: “ในฐานะ [บทบาท] ฉันต้องการ [ความสามารถ] เพื่อ [ประโยชน์]”\n\nAcceptance Criteria ระบุเงื่อนไขที่ถือว่างานเสร็จ มักเขียนแบบ Given / When / Then เช่น เมื่อผู้เยี่ยมชมยังไม่เลือกคุกกี้ และโหลดหน้าเว็บ ระบบต้องแสดงแบนเนอร์คุกกี้\n\nเกณฑ์ควรชัดเจนและทดสอบได้ และใช้เป็นจุดเริ่มต้นของสถานการณ์ทดสอบ UAT"},
 refs:[],related:["brd-fsd"]},
{id:"consent",cat:"Privacy & Security",tags:["PDPA","Cookie","Consent"],created:"2026-11-12",updated:"2026-11-12",
 title:{en:"Privacy Notice, Cookie Banner and Consent: how they fit",th:"Privacy Notice, Cookie Banner และ Consent เกี่ยวข้องกันอย่างไร"},
 sum:{en:"A general overview of three related privacy building blocks (not legal advice).",th:"ภาพรวมทั่วไปของ 3 องค์ประกอบด้านความเป็นส่วนตัวที่เกี่ยวข้องกัน (ไม่ใช่คำปรึกษาทางกฎหมาย)"},
 body:{en:"A privacy notice tells people what personal data is collected, why, and for how long. A cookie banner lets visitors choose which non-essential cookies a site may set. A consent form or consent record captures an individual’s agreement where consent is the basis for processing.\n\nIn Thailand these topics relate to the PDPA. Verify requirements against the official law and your organization’s legal guidance before relying on this note.",th:"Privacy Notice แจ้งว่าเก็บข้อมูลส่วนบุคคลอะไร เพื่ออะไร และนานเท่าใด Cookie Banner ให้ผู้เยี่ยมชมเลือกคุกกี้ที่ไม่จำเป็น ส่วน Consent Form หรือบันทึกความยินยอมใช้เก็บความยินยอมของบุคคลเมื่อฐานการประมวลผลคือความยินยอม\n\nในประเทศไทยหัวข้อเหล่านี้เกี่ยวข้องกับ พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA) ควรตรวจสอบกับกฎหมายและแนวทางขององค์กรก่อนนำไปใช้"},
 refs:[],related:[]},
{id:"inv",cat:"Enterprise Systems",tags:["ERP","Odoo","Inventory"],created:"2026-11-12",updated:"2026-11-12",
 title:{en:"RM, Semi-FG and FG in manufacturing inventory",th:"วัตถุดิบ กึ่งสำเร็จรูป และสำเร็จรูป ในสินค้าคงคลังการผลิต"},
 sum:{en:"How inventory stages map to a manufacturing flow in an ERP.",th:"สถานะสินค้าคงคลังสัมพันธ์กับกระบวนการผลิตใน ERP อย่างไร"},
 body:{en:"Raw Materials (RM) are purchased inputs. Semi-Finished Goods (Semi-FG) are intermediate products made in one step and consumed in another. Finished Goods (FG) are ready to sell.\n\nIn an ERP such as Odoo, each item has a product record and a Unit of Measure; a bill of materials defines what RM and Semi-FG become an FG, and stock moves record each step through the warehouse.",th:"วัตถุดิบ (RM) คือสิ่งที่ซื้อเข้ามา สินค้ากึ่งสำเร็จรูป (Semi-FG) คือผลิตภัณฑ์ระหว่างทางที่ผลิตในขั้นตอนหนึ่งและใช้ในอีกขั้นตอนหนึ่ง สินค้าสำเร็จรูป (FG) คือพร้อมขาย\n\nใน ERP เช่น Odoo สินค้าแต่ละรายการมีข้อมูลสินค้าและหน่วยวัด ส่วน Bill of Materials กำหนดว่า RM และ Semi-FG ใดกลายเป็น FG และการเคลื่อนไหวสต็อกบันทึกแต่ละขั้นตอนในคลัง"},

 <div class="ph pic"><span>${l.ph}</span><img src="${src('images/profile.jpg')}" alt="${esc(T(P.name))}" onerror="this.remove()"></div></div>
 <section id="education"><h2>${l.edu}</h2><p class="sub">${l.eduS}</p><div class="tl">${DATA.education.map(e=>`<div class="it ${e.future?"f":""}"><small>${T(e.when)}</small><h3>${T(e.title)}</h3><p style="margin:4px 0;color:var(--mu)">${T(e.body)}</p>${e.courses?tags(e.courses):""}</div>`).join("")}</div></section>
 <section id="experience"><h2>${l.exp}</h2><p class="sub">${l.expS}</p><div class="tl">${DATA.experience.map(e=>`<div class="it"><small>${T(e.when)}</small><div class="card"><h3>${T(e.role)}</h3>${e.org?`<p style="margin:2px 0;color:var(--acx);font-weight:600">${e.org}</p>`:""}${e.domain?`<p style="margin:2px 0 10px;color:var(--mu)">${T(e.domain)}</p>`:""}${e.items&&T(e.items).length?`<ul style="margin:0;padding-left:20px;color:var(--mu)">${T(e.items).map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${e.links?`<p style="margin:12px 0 0;font-size:14px">${e.links.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(" · ")}</p>`:""}</div></div>`).join("")}</div></section>
 <section id="projects"><h2>${l.proj}</h2><p class="sub">${l.projS}</p><div class="grid">${DATA.projects.map(p=>`<details id="p-${p.id}"><summary>${T(p.title)}</summary><div style="margin-top:10px"><span class="tag st">${l.status[p.status]}</span><span class="tag">${p.cat}</span>${p.when?`<span class="tag">${p.when}</span>`:""}<p>${T(p.sum)}</p><h4>${l.role}</h4><p>${T(p.role)}</p><h4>${l.areas}</h4><ul>${T(p.areas).map(x=>`<li>${x}</li>`).join("")}</ul><h4>${l.tools}</h4>${tags(p.tools)}</div></details>`).join("")}</div></section>
 <section id="skills"><h2>${l.sk}</h2><p class="sub">${l.skS}</p><div class="grid">${DATA.skills.map(g=>`<div class="card sk"><h3>${T(g.cat)}</h3>${g.items.map(i=>`<span class="tag">${esc(T(i))}${i.level?" · "+i.level:""}</span>`).join("")}</div>`).join("")}</div></section>
 <section id="knowledge"><h2>${l.kh}</h2><p class="sub">${l.khS}</p><div class="chips">${["all",...new Set(DATA.knowledge.map(k=>k.cat))].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c==="all"?l.all:c}</button>`).join("")}</div>
 <div class="grid">${DATA.knowledge.filter(k=>cat==="all"||k.cat===cat).map(k=>`<details id="k-${k.id}"><summary>${T(k.title)}</summary><div style="margin-top:10px"><span class="tag st">${k.cat}</span>${tags(k.tags)}<p><em>${T(k.sum)}</em></p>${fmt(T(k.body))}<p style="font-size:13px">${l.upd}: ${k.updated}</p>${k.related.length?`<p style="font-size:14px">${l.tags}: ${k.related.map(r=>{const x=DATA.knowledge.find(z=>z.id===r);return x?`<a href="#k-${r}" data-open="k-${r}">${T(x.title)}</a>`:""}).join(" · ")}</p>`:""}</div></details>`).join("")}</div></section>
 <section id="journey"><h2>${l.jr}</h2><p class="sub">${l.jrS}</p><div class="path">${DATA.journey.filter(j=>j.main).map((j,i,a)=>`<div class="pn ${j.now?"now":""} ${j.type==="future"?"nx":""}">${crest(j)}<b>${T(j.short)}</b><small>${T(j.when)}</small></div>${i<a.length-1?'<span class="ar" aria-hidden="true">→</span>':""}`).join("")}</div>
 <div class="ct">${DATA.journey.map(j=>`<div class="cr ${j.now?"now":""}"><small>${T(j.when)}</small><div class="o">${crest(j)}<div><b>${T(j.org)}</b><br><small>${T(j.role)}</small></div></div><span><span class="tag">${l.jt[j.type]}</span>${j.now?`<span class="tag st">${l.now}</span>`:""}</span></div>`).join("")}</div>
 <h2 style="margin-top:44px;font-size:22px">${l.ph2}</h2><div style="margin-top:14px">${DATA.philosophy.map(x=>`<p class="ph2">${T(x)}</p>`).join("")}</div></section>
 <section id="contact"><h2>${l.ct}</h2><p class="sub">${l.ctS}</p><div class="btns" style="margin-top:0">
 ${lk.email?`<button class="btn" id="cp">${l.copy}</button>`:`<span class="btn" style="opacity:.55">${l.copy} · ${l.ph3}</span>`}
 ${link(lk.linkedin,"LinkedIn")}${link(lk.github,"GitHub")}${link(lk.medium,"Medium")}${lk.cv?`<a class="btn o" href="${lk.cv}" download>${l.cv}</a>`:link("",l.cv)}<button class="btn o" onclick="print()">${l.print}</button></div></section></div>`;
 $("#foot").innerHTML=`<span>${l.foot}</span>`;
 const cp=$("#cp");if(cp)cp.onclick=()=>{navigator.clipboard.writeText(P.links.email).then(()=>{cp.textContent=l.copied;setTimeout(()=>cp.textContent=l.copy,1500)})};
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;const y=scrollY;render();scrollTo(0,y)});
 document.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();const d=document.getElementById(a.dataset.open);if(d){d.open=true;d.scrollIntoView({block:"center"})}});
 spy();
}
/* search across projects, knowledge, skills, experience */
const crest=j=>j.logo?`<div class="crest lg" style="background:${j.bg||'#fff'}"><img src="${src(j.logo)}" alt="${esc(T(j.org))} logo" loading="lazy" onerror="this.replaceWith(document.createTextNode('${j.ab}'))"></div>`:`<div class="crest">${j.ab}</div>`;
function search(v){
 v=v.trim().toLowerCase();const r=$("#res");if(!v){r.style.display="none";return}
 const out=[];
 DATA.projects.forEach(p=>{if(JSON.stringify(p).toLowerCase().includes(v))out.push({t:T(p.title),k:L().proj,h:"p-"+p.id})});
 DATA.knowledge.forEach(k=>{if(JSON.stringify(k).toLowerCase().includes(v))out.push({t:T(k.title),k:L().kh,h:"k-"+k.id})});
 DATA.skills.forEach(g=>g.items.forEach(i=>{if(T(i).toLowerCase().includes(v))out.push({t:T(i),k:L().sk,h:"skills"})}));
 DATA.experience.forEach(e=>{if(JSON.stringify(e).toLowerCase().includes(v))out.push({t:T(e.role),k:L().exp,h:"experience"})});
 r.innerHTML=out.length?out.slice(0,12).map(o=>`<a href="#${o.h}" data-h="${o.h}">${esc(o.t)}<small>${o.k}</small></a>`).join(""):`<p>${L().none}</p>`;r.style.display="block";
}
function spy(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(e.target.id==="education"?"about":e.target.id)))}),{rootMargin:"-40% 0px -55% 0px"});
 document.querySelectorAll("section,#about").forEach(s=>o.observe(s))}
$("#q").addEventListener("input",e=>search(e.target.value));
$("#res").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();const d=document.getElementById(a.dataset.h);if(d){if(d.tagName==="DETAILS"){if(!d.open)d.open=true}d.scrollIntoView({block:"center"})}$("#res").style.display="none"});
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))$("#res").style.display="none";if(e.target.closest("#links a"))$("#links").classList.remove("open")});
$("#menu").onclick=()=>{const o=$("#links").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#lang").onclick=()=>{lang=lang==="en"?"th":"en";try{localStorage.setItem("lang",lang)}catch(e){}render();search($("#q").value)};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";try{localStorage.setItem("theme",theme)}catch(e){}document.documentElement.dataset.theme=theme};
render();
</script>
</body>
</html>
